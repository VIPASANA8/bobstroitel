<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Poker8 · Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;600;700;800&display=swap" />
<link rel="stylesheet" href="/static/network.css?v=desktop-oval-43" />
</head>
<body>
<div class="network-shell profile-shell">
  <header class="network-header">
    <a class="network-brand" href="/"><span class="brand-chip">P8</span><span><b>Poker8</b><small>PLAYER PROFILE</small></span></a>
    <!-- The text link this replaces is display:none below 760px, which is every
         phone -- so on the width this product is actually played at, the profile
         page had no way back to the lobby at all. -->
    <a class="profile-chip" href="/" aria-label="Лобби" title="Лобби">🏠</a>
  </header>
  <main>
    <section class="profile-hero">
      <p class="eyebrow">YOUR RECORD</p>
      <h1 id="profileName">Игрок</h1>
      <p id="telegramId" class="dialog-muted"></p>
      <div class="profile-level">
        <span id="levelBadge">LEVEL 0</span>
        <div><strong id="levelProgress">—</strong><small>до следующего уровня</small></div>
      </div>
    </section>

    <section class="profile-metrics">
      <div><span>Победы</span><strong id="wins">—</strong></div>
      <div><span>Раздачи</span><strong id="hands">—</strong></div>
      <!-- A link, not a tile with a click handler: pressing the balance is how
           people expect to reach a top-up, and an anchor gets that with focus
           and keyboard behaviour for free. -->
      <a class="metric-link" href="#topup"><span>Wallet</span><strong id="walletBalance">—</strong><em>пополнить</em></a>
      <div><span>За столом</span><strong id="tableStack">—</strong></div>
    </section>

    <section id="topup" class="profile-section topup-section">
      <div class="section-heading">
        <div><p class="eyebrow">WALLET</p><h2>Пополнение</h2></div>
      </div>
      <div class="topup-card">
        <div class="topup-presets" id="topupPresets">
          <button type="button" data-amount="10000">+100</button>
          <button type="button" data-amount="50000">+500</button>
          <button type="button" data-amount="100000">+1000</button>
        </div>
        <label class="topup-field">
          <span>Своя сумма</span>
          <input id="topupAmount" type="number" min="1" step="1" inputmode="numeric" placeholder="250" />
        </label>
        <button id="topupSubmit" class="primary-action topup-submit" type="button"><strong>Пополнить</strong></button>
        <p id="topupNote" class="topup-note">Проверяем доступность…</p>
      </div>
    </section>

    <section class="profile-section">
      <div class="section-heading">
        <div><p class="eyebrow">LAST 20</p><h2>История раздач</h2></div>
      </div>
      <div id="handHistory" class="history-list"></div>
    </section>

    <section class="profile-section">
      <div class="section-heading">
        <div><p class="eyebrow">LEDGER</p><h2>Журнал фишек</h2></div>
      </div>
      <div id="ledger" class="history-list"></div>
    </section>

    <a id="returnToTable" class="quick-play return-link" href="/table" hidden>Вернуться к столу →</a>
  </main>
  <footer class="network-footer">
    <span>Виртуальные фишки · без real-money API</span>
    <span>Powered by Poker8</span>
  </footer>
</div>
<script src="/static/auth-client.js?v=desktop-oval-43"></script>
<script src="/static/profile.js?v=desktop-oval-43"></script>
</body>
</html>
