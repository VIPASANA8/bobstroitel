<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poker8 · Мониторинг</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;600;700;800&display=swap" />
  <style>
    :root { color-scheme: dark; font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; background:#07100e; color:#e7fff5; }
    h1 { font-family: 'Unbounded', 'Manrope', ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% -10%,#0c4938 0%,#07100e 44%,#020605 100%); }
    main { max-width:900px; margin:0 auto; padding:24px 16px 40px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding:8px 0 22px; border-bottom:1px solid rgba(94,255,196,.2); }
    h1 { font-size:24px; margin:0; } p { color:#9ebbb1; margin:6px 0 0; } #updated { font-size:12px; color:#80d6b4; text-align:right; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:18px; }
    .card { background:rgba(6,29,23,.82); border:1px solid rgba(87,241,183,.22); box-shadow:inset 0 1px rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.22); border-radius:16px; padding:16px; }
    .label { display:block; color:#8ca79d; font-size:12px; letter-spacing:.07em; text-transform:uppercase; } .value { display:block; font-size:28px; font-weight:800; margin-top:5px; color:#65f7bd; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; } td { padding:9px 0; border-bottom:1px solid rgba(148,255,206,.1); } td:last-child { text-align:right; font-weight:700; color:#d9fff0; }
    .ok { color:#65f7bd!important; } .warn { color:#ffc762!important; } .error { color:#ff8d9d!important; }
    @media (max-width:600px) { main{padding:18px 12px 32px}.grid{grid-template-columns:1fr}.value{font-size:25px} header{align-items:flex-start;flex-direction:column}#updated{text-align:left} }
  </style>
</head>
<body>
  <main>
    <header><div><h1>Poker8 · Мониторинг</h1><p>Обновление каждые 5 секунд</p></div><div id="updated">Загрузка…</div></header>
    <section class="grid">
      <article class="card"><span class="label">Столы</span><strong id="tables" class="value">—</strong><span id="phaseSummary">—</span></article>
      <article class="card"><span class="label">Активные места</span><strong id="seats" class="value">—</strong><span>люди и системные игроки</span></article>
      <article class="card"><span class="label">Цикл координатора</span><strong id="tick" class="value">—</strong><span id="tickDetail">—</span></article>
      <article class="card"><span class="label">Проверка escrow</span><strong id="integrity" class="value">—</strong><span id="integrityDetail">—</span></article>
    </section>
    <section class="card" style="margin-top:12px"><span class="label">Фазы столов</span><table id="phases"><tbody><tr><td>Загрузка…</td><td>—</td></tr></tbody></table></section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const set = (id, text, cls='') => { const node=$(id); node.textContent=text; node.className=cls; };
    async function refresh() {
      try {
        const response = await fetch('/health/metrics', {cache:'no-store'});
        if (!response.ok) throw new Error('metrics unavailable');
        const data = await response.json();
        const phases = data.tables.phases || {};
        set('tables', data.tables.total, 'value ok');
        $('phaseSummary').textContent = Object.entries(phases).map(([k,v]) => `${k}: ${v}`).join(' · ') || 'нет runtime';
        set('seats', data.tables.active_seats, 'value ok');
        const tick = data.coordinator.last_tick_duration_ms;
        set('tick', tick == null ? '—' : `${tick} мс`, tick != null && tick < 50 ? 'value ok' : 'value warn');
        $('tickDetail').textContent = data.coordinator.last_tick_at ? `последний: ${new Date(data.coordinator.last_tick_at).toLocaleTimeString('ru-RU')}` : 'ожидание первого цикла';
        const findings = data.integrity.last_finding_count;
        const state = findings ? 'error' : 'ok';
        set('integrity', findings == null ? '—' : findings === 0 ? 'OK' : `${findings} !`, `value ${state}`);
        $('integrityDetail').textContent = `проверка: ${data.integrity.last_check_duration_ms ?? '—'} мс · 24ч событий: ${data.integrity.events_last_24h} · webhook: ${data.integrity.webhook_configured ? 'вкл' : 'не задан'} · Telegram: ${data.integrity.telegram_configured ? 'вкл' : 'не задан'}`;
        $('phases').innerHTML = Object.entries(phases).map(([phase,count]) => `<tr><td>${phase}</td><td>${count}</td></tr>`).join('') || '<tr><td>Нет данных</td><td>—</td></tr>';
        $('updated').textContent = `Обновлено ${new Date(data.generated_at).toLocaleTimeString('ru-RU')}`;
      } catch (error) { $('updated').textContent = 'Метрики недоступны'; }
    }
    refresh(); setInterval(refresh, 5000);
  </script>
</body>
</html>
