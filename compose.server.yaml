services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poker8}
      POSTGRES_USER: ${POSTGRES_USER:-poker8}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - poker8_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POKER8_ENV: ${POKER8_ENV:-staging}
      POKER8_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-poker8}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-poker8}
      POKER8_DEFAULT_TENANT: ${POKER8_DEFAULT_TENANT:-poker8}
      POKER8_DEFAULT_BOT_TOKEN: ${POKER8_DEFAULT_BOT_TOKEN:?POKER8_DEFAULT_BOT_TOKEN is required}
      POKER8_TENANTS_JSON: ${POKER8_TENANTS_JSON:?POKER8_TENANTS_JSON is required}
      POKER8_COORDINATOR_ENABLED: ${POKER8_COORDINATOR_ENABLED:-1}
      # TEMPORARY -- delete this line to restore bot seating before the
      # MVP release. Off while live testing needs the free seats beside a
      # player to stay free; bots already at a table keep playing, and an
      # empty room still fills to its own count so the lobby holds a table
      # at every player count from one to six.
      POKER8_SEAT_IDLE_BOTS: ${POKER8_SEAT_IDLE_BOTS:-0}
      POKER8_OPEN_ACCESS: ${POKER8_OPEN_ACCESS:-0}
    # --proxy-headers so the client address in X-Forwarded-For is the one the
    # rate limiter counts. Trusting every hop is safe only because the app
    # publishes no port of its own: Caddy is the only way a request arrives.
    command: ["sh", "-c", "python -m alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  poker8_pgdata:
